[project]
name = "wordflip-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "DJ008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts", "telegram_auth", "words", "decks", "games", "ocr", "gamification", "telegram_bot", "duels", "botquiz", "exams", "tts", "jobs", "broadcasts", "classes"]
