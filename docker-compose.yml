# Optional production-like local run of the single service (same settings as Render):
#   docker compose up --build   →  http://localhost:8000
# Day-to-day development doesn't need Docker: see README (runserver + Vite).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yodflip
      POSTGRES_USER: yodflip
      POSTGRES_PASSWORD: yodflip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yodflip -d yodflip"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: .
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-local-prod-test-secret-key-change-me-0123456789}
      ALLOWED_HOSTS: localhost,127.0.0.1
      PUBLIC_URL: http://localhost:8000
      DATABASE_URL: postgres://yodflip:yodflip@db:5432/yodflip
      SECURE_SSL_REDIRECT: "false"   # local only: no TLS in front
      OCR_MOCK: ${OCR_MOCK:-true}    # sample scan results locally
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}  # webhook needs HTTPS, so it's not set locally
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@yodflip.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-change-me-admin-123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
