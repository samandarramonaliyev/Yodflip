# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates: Postgres, the Django API (Docker), the React static site and the Telegram bot worker.
databases:
  - name: wordflip-db
    plan: free
    databaseName: wordflip
    user: wordflip

services:
  - type: web
    name: wordflip-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wordflip-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://wordflip-web.onrender.com
      - key: FRONTEND_URL
        value: https://wordflip-web.onrender.com
      - key: BOT_API_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: wordflip-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Same-origin API calls: proxy /api, /admin, /static and /media to the Django service.
      - type: rewrite
        source: /api/*
        destination: https://wordflip-api.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://wordflip-api.onrender.com/admin/*
      - type: rewrite
        source: /static/*
        destination: https://wordflip-api.onrender.com/static/*
      - type: rewrite
        source: /media/*
        destination: https://wordflip-api.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: wordflip-bot
    runtime: docker
    rootDir: bot
    plan: starter
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://wordflip-web.onrender.com
      - key: BOT_BACKEND_URL
        value: https://wordflip-api.onrender.com
      - key: BOT_API_SECRET
        fromService:
          type: web
          name: wordflip-api
          envVarKey: BOT_API_SECRET
