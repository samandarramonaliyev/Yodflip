# Render Blueprint — https://render.com/docs/blueprint-spec
#
#   yodflip-db   Managed PostgreSQL
#   yodflip-web  Django API + the React build in ONE Docker web service (same origin, no CORS)
#   yodflip-bot  aiogram bot in WEBHOOK mode (a web service: Telegram must reach it over HTTPS)
#
# Plans: "free" lets you try it at no cost, but free web services sleep after ~15 min idle
# (30-60 s cold start) and a free Postgres database EXPIRES after 30 days. For real users,
# switch to web/bot: starter and db: basic-256mb (see DEPLOY.md).

databases:
  - name: yodflip-db
    plan: free
    databaseName: yodflip
    user: yodflip
    postgresMajorVersion: "16"

services:
  - type: web
    name: yodflip-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      # --- generated / wired automatically ---
      - key: DATABASE_URL
        fromDatabase:
          name: yodflip-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_API_SECRET
        generateValue: true
      # --- fixed values ---
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: OCR_DAILY_LIMIT
        value: "20"
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS are filled automatically from RENDER_EXTERNAL_HOSTNAME /
      # RENDER_EXTERNAL_URL (injected by Render). For a custom domain, add in the dashboard e.g.
      #   ALLOWED_HOSTS=yodflip.uz   CSRF_TRUSTED_ORIGINS=https://yodflip.uz   PUBLIC_URL=https://yodflip.uz
      # --- secrets: fill in the Render dashboard ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: yodflip-bot
    runtime: docker
    plan: free
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # RENDER_EXTERNAL_URL (injected) -> webhook mode, webhook set automatically on startup.
      - key: BOT_API_SECRET
        fromService:
          type: web
          name: yodflip-web
          envVarKey: BOT_API_SECRET
      - key: WEBHOOK_SECRET
        generateValue: true
      # Public HTTPS URL of yodflip-web (the Mini App + API). Change it if Render gives the
      # service a different hostname or you add a custom domain.
      - key: WEBAPP_URL
        value: https://yodflip-web.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
