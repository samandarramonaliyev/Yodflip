# Render Blueprint: ONE free-tier web service.
#   - build.sh: pip install → React build → collectstatic → migrate → seed (once) → admin user
#   - start:    gunicorn (Django serves the API, the React app and the Telegram bot webhook)
#   - database: external PostgreSQL (Neon) via DATABASE_URL
# See DEPLOY.md for the step-by-step guide.

services:
  - type: web
    name: yodflip
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      # --- runtime versions ---
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_MAJOR
        value: "20"
      # --- Django ---
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TIME_ZONE
        value: Asia/Tashkent
      # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS / PUBLIC_URL are filled automatically from Render's
      # RENDER_EXTERNAL_HOSTNAME / RENDER_EXTERNAL_URL. For a custom domain set them explicitly.
      # --- database: paste the Neon connection string (with ?sslmode=require) ---
      - key: DATABASE_URL
        sync: false
      # --- Telegram ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_APP_SHORT_NAME # from @BotFather /newapp (duel links); may stay empty
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: BOT_CRON_SECRET
        generateValue: true
      # "true" only on a paid instance that never sleeps (see DEPLOY.md 5c)
      - key: ALWAYS_ON_SCHEDULER
        value: "false"
      # --- Neural TTS (empty = browser voice) ---
      - key: TTS_PROVIDER
        value: google
      - key: GOOGLE_TTS_CREDENTIALS_JSON
        sync: false
      # --- OCR (needed for real scans on Render: the native runtime has no Tesseract) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: OCR_DAILY_LIMIT
        value: "20"
      # --- admin user, created during the build if missing ---
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
